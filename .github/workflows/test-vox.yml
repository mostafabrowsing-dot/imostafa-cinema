name: Test VOX access
on:
  push:
    paths:
      - '.github/workflows/test-vox.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Almaza showtimes
        shell: python
        run: |
          import urllib.request, re, json
          url = "https://egy.voxcinemas.com/showtimes?c=city-centre-almaza"
          with urllib.request.urlopen(url, timeout=60) as response:
              html = response.read().decode("utf-8")
              status = response.status
          movies = [re.sub("<[^>]+>", "", x).strip() for x in re.findall(r"<h2\b[^>]*>(.*?)</h2>", html, re.S | re.I)]
          print(json.dumps({"status": status, "movies": movies}, ensure_ascii=False, indent=2))
          assert status == 200 and movies and "City Centre Almaza" in html, "No valid Almaza listings"
